<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-label="FLOCK algorithm variants branch into exploration strategies and final inference corrections"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#222b36}.title{font-size:24px;font-weight:bold}.sub{font-size:18px}.small{font-size:16px}.eq{font-size:20px;font-family:Georgia,serif} .card{stroke:#cfd6df;stroke-width:2;fill:#fff}.line{stroke:#9da8b3;stroke-width:3;fill:none}</style><rect width="1100" height="530" rx="18" fill="#fbfaf7"/><rect x="356" y="22" width="388" height="75" rx="14" fill="#f5f0e8" stroke="#b7a895" stroke-width="2"/><text x="550" y="52" text-anchor="middle" class="title">FLOCK</text><text x="550" y="79" text-anchor="middle" class="small">Scout → Followers / Pioneers → Consolidation</text><path class="line" d="M550 97V122M275 122H825M275 122V144M825 122V144"/><rect class="card" x="55" y="145" width="475" height="350" rx="18"/><rect class="card" x="570" y="145" width="475" height="350" rx="18"/><text x="292" y="181" text-anchor="middle" class="title">Exploration strategy</text><text x="807" y="181" text-anchor="middle" class="title">Final inference</text><path d="M75 198H510M590 198H1025" stroke="#e1e3e5" stroke-width="2"/><text x="80" y="231" class="sub" font-weight="bold">Novelty search</text><text x="80" y="259" class="eq">x* = arg max N(x)</text><path d="M75 276H510" stroke="#e1e3e5"/><text x="80" y="308" class="sub" font-weight="bold">Orthogonal pioneers</text><text x="80" y="335" class="eq">Σ = VΛVᵀ</text><text x="80" y="362" class="eq">x′ = x + cⱼvⱼ</text><path d="M75 379H510" stroke="#e1e3e5"/><text x="80" y="411" class="sub" font-weight="bold">Repulsive walkers</text><text x="80" y="442" class="eq">π̃(x₁,…,xₖ) ∝ ∏ π(xᵢ) R(x)</text><text x="595" y="237" class="sub" font-weight="bold">Frozen global-proposal MH</text><text x="595" y="275" class="eq">α(x,y) = min{1, π(y)q(x) / [π(x)q(y)]}</text><path d="M590 304H1025" stroke="#e1e3e5"/><text x="595" y="343" class="sub" font-weight="bold">Importance consolidation</text><text x="595" y="379" class="eq">wᵢ = π*(xᵢ) / q(xᵢ)</text><text x="595" y="411" class="eq">Ê[f] = Σ wᵢ f(xᵢ) / Σ wᵢ</text><text x="550" y="518" text-anchor="middle" font-size="15" fill="#667">Conceptual relationships; methods differ in selection rules, proposal kernels, and inference target.</text></svg>