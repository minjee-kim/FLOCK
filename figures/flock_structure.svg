<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="575" viewBox="0 0 1040 575" role="img" aria-label="FLOCK three-stage workflow: scouts, followers and pioneers, final sampler">
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#222}
  .head{font-size:25px;font-weight:700}.sub{font-size:17px;fill:#555}
  .box{fill:#fff;stroke:#dedede;stroke-width:1.5}
  .arrow{fill:none;stroke:#999;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="1040" height="575" fill="#fff"/>
<rect class="box" x="24" y="20" width="992" height="530" rx="18"/>
<circle cx="386" cy="75" r="13" fill="none" stroke="#ee6f23" stroke-width="3"/>
<circle cx="386" cy="75" r="5" fill="none" stroke="#ee6f23" stroke-width="2"/>
<text class="head" x="414" y="84">Stage 1 — Scouts</text>
<text class="sub" x="520" y="116" text-anchor="middle">Aggressive exploration to identify promising and unexplored regions</text>
<rect x="425" y="132" width="90" height="30" rx="15" fill="#f3f3f3"/><rect x="525" y="132" width="90" height="30" rx="15" fill="#f3f3f3"/>
<text x="470" y="152" text-anchor="middle" font-size="16">Scout 1</text><text x="570" y="152" text-anchor="middle" font-size="16">Scout 2</text>
<path class="arrow" d="M520 171v23m-7-7 7 7 7-7"/>
<rect class="box" x="48" y="210" width="944" height="222" rx="16"/>
<text class="head" x="520" y="247" text-anchor="middle">Stage 2 — Main body</text>
<circle cx="283" cy="295" r="12" fill="none" stroke="#24b54a" stroke-width="3"/><circle cx="283" cy="295" r="6" fill="none" stroke="#24b54a" stroke-width="2"/><circle cx="283" cy="295" r="2.5" fill="#24b54a"/>
<circle cx="747" cy="295" r="13" fill="none" stroke="#347ade" stroke-width="2.5" stroke-dasharray="5 5"/><circle cx="747" cy="295" r="4" fill="none" stroke="#347ade" stroke-width="2"/>
<text class="head" x="283" y="334" text-anchor="middle">Followers</text>
<text class="head" x="747" y="334" text-anchor="middle">Pioneers</text>
<text class="sub" x="283" y="362" text-anchor="middle">Explore high-posterior regions</text>
<text class="sub" x="283" y="383" text-anchor="middle">discovered by scouts</text>
<text class="sub" x="747" y="362" text-anchor="middle">Explore areas missed or poorly</text>
<text class="sub" x="747" y="383" text-anchor="middle">covered by scouts</text>
<text class="sub" x="520" y="414" text-anchor="middle">Middle chains share discoveries and update exploration priorities between rounds</text>
<path class="arrow" d="M520 439v23m-7-7 7 7 7-7"/>
<circle cx="352" cy="492" r="12" fill="none" stroke="#222" stroke-width="2.5"/><path d="m346 492 4 4 8-9" fill="none" stroke="#222" stroke-width="2.5"/>
<text class="head" x="380" y="500">Stage 3 — Final sampler</text>
<text class="sub" x="520" y="530" text-anchor="middle">Construct a global proposal from all discoveries, then sample with a valid MH correction</text>
</svg>